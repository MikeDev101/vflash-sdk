name: Build and Verify V.Flash SDK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install toolchain and build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake \
            ninja-build \
            gcc-arm-none-eabi \
            binutils-arm-none-eabi \
            libnewlib-arm-none-eabi \
            libstdc++-arm-none-eabi-newlib \
            xorriso \
            genisoimage \
            ffmpeg \
            python3 \
            python3-pil \
            gcc

      - name: Configure CMake (V.Flash ARM toolchain)
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=cmake/toolchain-vflash.cmake

      - name: Build all SDK libraries and demo executables
        run: cmake --build build --parallel

      - name: Build all demo disc images
        run: |
          disc_targets=$(ninja -C build -t targets all | awk -F: '/(^|_)disc_image: phony/ {print $1}')
          echo "Building disc targets:"
          echo "$disc_targets"
          cmake --build build --parallel --target $disc_targets

      - name: Run CTest
        run: ctest --test-dir build --output-on-failure

      - name: Run host unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Package demo disc images
        run: |
          mkdir -p dist/demo-images
          while IFS= read -r cue_file; do
            dir=$(dirname "$cue_file")
            rel=${dir#build/}
            mkdir -p "dist/demo-images/$rel"
            cp -f "$dir"/*.cue "$dir"/*.bin "$dir"/*.iso "$dir"/BOOT.BIN "dist/demo-images/$rel/" 2>/dev/null || true
          done < <(find build -path '*/CMakeFiles/*' -prune -o -name '*.cue' -print | sort)
          ls -la dist/demo-images

      - name: Upload demo disc images artifact
        uses: actions/upload-artifact@v4
        with:
          name: vflash-demo-images
          path: dist/demo-images
          if-no-files-found: error
